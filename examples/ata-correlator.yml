---
version: 2
title: ATA Correlator
summary: Simple correlator example for the Allen Telescope Array (ATA).
graph:
  - name: nexus_bridge
    module: nexus_bridge
    device: cpu
    runtime: python
    provider: generic
    config:
      url: 'https://nexus.stelline.space'
    meta:
      node:
        x: 382.66666
        y: 825.6667
        width: 274
        height: 0
        configCollapsed: false
  - name: ata_receiver
    module: ata_receiver
    device: cuda
    runtime: native
    provider: generic
    config:
      engine: ibverbs
      interfaceAddress: '0000:01:00.0'
      gpuDeviceId: 0
      masterCore: 0
      workerCores: '[1]'
      subscriptions: |
        - 10.11.1.201:10000 -> 239.1.1.1:50000
        - 10.11.1.202:10000 -> 239.1.1.1:50000
        - 10.11.1.203:10000 -> 239.1.1.1:50000
        - 10.11.1.204:10000 -> 239.1.1.1:50000
        - 10.11.1.231:10000 -> 239.1.1.1:50000
        - 10.11.1.232:10000 -> 239.1.1.1:50000
        - 10.11.1.233:10000 -> 239.1.1.1:50000
        - 10.11.1.234:10000 -> 239.1.1.1:50000
      totalBlock: '[28, 192, 8192, 2]'
      partialBlock: '[1, 96, 16, 2]'
      offsetBlock: '[0, 352, 0, 0]'
      dataType: CI8
      packetsPerBurst: 8192
      maxConcurrentBursts: 64
      maxConcurrentBlocks: 16
      outputPoolSize: 16
    meta:
      node:
        x: 36
        y: 13
        width: 274
        height: 0
        configCollapsed: false
  - name: correlator
    module: correlator
    device: cuda
    runtime: native
    provider: generic
    config:
      integrationRate: 1
      conjugateAntennaIndex: 1
      calculationMode: single_precision_fp
    input:
      buffer: '${graph.ata_receiver.output.output}'
    meta:
      node:
        x: 383.33334
        y: 343.66666
        width: 159
        height: 0
        configCollapsed: false
  - name: permutation_1
    module: permutation
    device: cuda
    runtime: native
    provider: generic
    config:
      permutation: '[2, 0, 1, 3]'
      contiguous: false
    input:
      buffer: '${graph.correlator.output.buffer}'
    meta:
      node:
        x: 617
        y: 342
        width: 140
        height: 0
        configCollapsed: false
  - name: duplicate
    module: duplicate
    device: cuda
    runtime: native
    provider: generic
    config:
      hostAccessible: false
      outputDevice: cuda
    input:
      buffer: '${graph.permutation_1.output.buffer}'
    meta:
      node:
        x: 816
        y: 342.66666
        width: 140
        height: 0
        configCollapsed: false
  - name: uvh5_writer
    module: uvh5_writer
    device: cuda
    runtime: native
    provider: generic
    config:
      filepath: /mnt/raid1/test.uvh5
      dspChannelizationRate: 1
      dspIntegrationRate: 1
      overwrite: true
      recording: false
    input:
      input: '${graph.duplicate.output.buffer}'
    meta:
      node:
        x: 1016.3333
        y: 331.66666
        width: 140
        height: 0
        configCollapsed: false
