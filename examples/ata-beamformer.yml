---
version: 2
title: ATA Beamformer
summary: Simple beamformer example for the Allen Telescope Array (ATA).
graph:
  - name: nexus_bridge
    module: nexus_bridge
    device: cpu
    runtime: python
    provider: generic
    config:
      url: 'https://nexus.stelline.space'
    meta:
      node:
        x: 382
        y: 821
        width: 274
        height: 0
        configCollapsed: false
  - name: ones_tensor
    module: ones_tensor
    device: cuda
    runtime: native
    provider: generic
    config:
      shape: '[1, 28, 192, 1, 2]'
      dataType: CF32
    meta:
      node:
        x: 384
        y: 419
        width: 195
        height: 0
        configCollapsed: false
  - name: ata_receiver
    module: ata_receiver
    device: cuda
    runtime: native
    provider: generic
    config:
      engine: ibverbs
      interfaceAddress: '0000:01:00.0'
      gpuDeviceId: 0
      masterCore: 0
      workerCores: '[1]'
      subscriptions: |
        - 10.11.1.201:10000 -> 239.1.1.1:50000
        - 10.11.1.202:10000 -> 239.1.1.1:50000
        - 10.11.1.203:10000 -> 239.1.1.1:50000
        - 10.11.1.204:10000 -> 239.1.1.1:50000
        - 10.11.1.231:10000 -> 239.1.1.1:50000
        - 10.11.1.232:10000 -> 239.1.1.1:50000
        - 10.11.1.233:10000 -> 239.1.1.1:50000
        - 10.11.1.234:10000 -> 239.1.1.1:50000
      totalBlock: '[28, 192, 8192, 2]'
      partialBlock: '[1, 96, 16, 2]'
      offsetBlock: '[0, 352, 0, 0]'
      dataType: CI8
      packetsPerBurst: 8192
      maxConcurrentBursts: 64
      maxConcurrentBlocks: 16
      outputPoolSize: 16
    meta:
      node:
        x: 36
        y: 13
        width: 274
        height: 0
        configCollapsed: false
  - name: beamformer
    module: beamformer
    device: cuda
    runtime: native
    provider: generic
    config:
      enableIncoherentBeam: false
      enableIncoherentBeamSqrt: false
      blockSize: 512
    input:
      phasors: '${graph.ones_tensor.output.buffer}'
      buffer: '${graph.ata_receiver.output.output}'
    meta:
      node:
        x: 649
        y: 345
        width: 140
        height: 0
        configCollapsed: false
  - name: detector
    module: detector
    device: cuda
    runtime: native
    provider: generic
    config:
      integrationRate: 1
      numberOfOutputPolarizations: 4
      blockSize: 512
    input:
      buffer: '${graph.beamformer.output.buffer}'
    meta:
      node:
        x: 845
        y: 344
        width: 140
        height: 0
        configCollapsed: false
  - name: permutation_2
    module: permutation
    device: cuda
    runtime: native
    provider: generic
    config:
      permutation: '[2, 0, 1, 3]'
      contiguous: false
    input:
      buffer: '${graph.detector.output.buffer}'
    meta:
      node:
        x: 1035
        y: 346
        width: 140
        height: 0
        configCollapsed: false
  - name: duplicate
    module: duplicate
    device: cuda
    runtime: native
    provider: generic
    config:
      hostAccessible: false
      outputDevice: cuda
    input:
      buffer: '${graph.permutation_2.output.buffer}'
    meta:
      node:
        x: 1238.6666
        y: 342.66666
        width: 140
        height: 0
        configCollapsed: false
  - name: fbh5_writer
    module: fbh5_writer
    device: cuda
    runtime: native
    provider: generic
    config:
      filepath: /mnt/raid1/file.fbh5
      overwrite: true
      recording: true
    input:
      input: '${graph.duplicate.output.buffer}'
    meta:
      node:
        x: 1445
        y: 330.33334
        width: 140
        height: 0
        configCollapsed: false
