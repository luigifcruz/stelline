---
version: 2
title: ATA Spectrogram
summary: Simple lineplot plot for the Allen Telescope Array (ATA).
graph:
  - name: ata_receiver
    module: ata_receiver
    device: cuda
    runtime: native
    provider: generic
    config:
      engine: ibverbs
      interfaceAddress: '0000:01:00.0'
      gpuDeviceId: 0
      masterCore: 0
      workerCores: '[1]'
      subscriptions: |
        - 10.11.1.201:10000 -> 239.1.1.1:50000
        - 10.11.1.202:10000 -> 239.1.1.1:50000
        - 10.11.1.203:10000 -> 239.1.1.1:50000
        - 10.11.1.204:10000 -> 239.1.1.1:50000
        - 10.11.1.231:10000 -> 239.1.1.1:50000
        - 10.11.1.232:10000 -> 239.1.1.1:50000
        - 10.11.1.233:10000 -> 239.1.1.1:50000
        - 10.11.1.234:10000 -> 239.1.1.1:50000
      totalBlock: '[28, 192, 8192, 2]'
      partialBlock: '[1, 96, 16, 2]'
      offsetBlock: '[0, 352, 0, 0]'
      dataType: CF32
      packetsPerBurst: 8192
      maxConcurrentBursts: 64
      maxConcurrentBlocks: 32
      outputPoolSize: 32
    meta:
      node:
        x: 36.666668
        y: 111.333336
        width: 260
        height: 0
        configCollapsed: false
  - name: slice_pol0
    module: slice
    device: cuda
    runtime: native
    provider: generic
    config:
      slice: '[:1, :, :2048, :]'
      contiguous: false
    input:
      buffer: '${graph.ata_receiver.output.output}'
    meta:
      node:
        x: 357.92593
        y: 113.111084
        width: 120
        height: 0
        configCollapsed: false
  - name: channelizer
    module: channelizer
    device: cuda
    runtime: native
    provider: generic
    input:
      buffer: '${graph.slice_pol0.output.buffer}'
    meta:
      node:
        x: 519.3333
        y: 108
        width: 140
        height: 0
        configCollapsed: false
  - name: slice
    module: slice
    device: cuda
    runtime: native
    provider: generic
    config:
      slice: '[0, ::64, 0, 0]'
      contiguous: true
    input:
      buffer: '${graph.channelizer.output.buffer}'
    meta:
      node:
        x: 711.3333
        y: 104.666664
        width: 140
        height: 0
        configCollapsed: false
  - name: duplicate
    module: duplicate
    device: cuda
    runtime: native
    provider: generic
    config:
      hostAccessible: true
      outputDevice: cpu
    input:
      buffer: '${graph.slice.output.buffer}'
    meta:
      node:
        x: 898
        y: 98.666664
        width: 140
        height: 0
        configCollapsed: false
  - name: amplitude
    module: amplitude
    device: cpu
    runtime: native
    provider: generic
    input:
      signal: '${graph.duplicate.output.buffer}'
    meta:
      node:
        x: 1098
        y: 96
        width: 120
        height: 0
        configCollapsed: false
  - name: range
    module: range
    device: cpu
    runtime: native
    provider: generic
    config:
      min: 20
      max: 50
    input:
      signal: '${graph.amplitude.output.signal}'
    meta:
      node:
        x: 1269.3334
        y: 97.333336
        width: 140
        height: 0
        configCollapsed: false
  - name: lineplot_1
    module: lineplot
    device: cpu
    runtime: native
    provider: generic
    config:
      averaging: 48
      maxHold: false
      fill: true
      rangeMin: -100
      rangeMax: 0
      xLabel: Frequency (MHz)
      yLabel: Amplitude (dBFS)
    input:
      signal: '${graph.range.output.signal}'
    meta:
      node:
        x: 1514.6666
        y: 91.333336
        width: 945.3333
        height: 350
        configCollapsed: false
      surface_default:
        attachedHeight: 260
        detachedWidth: 1593
        detachedHeight: 952
        detached: false
        detachedConfigOpen: false
  - name: waterfall
    module: waterfall
    device: cpu
    runtime: native
    provider: generic
    config:
      height: 1024
      averaging: 3
      xLabel: Frequency (MHz)
      yLabel: Time
    input:
      signal: '${graph.range.output.signal}'
    meta:
      node:
        x: 1513.3334
        y: 504.66666
        width: 956
        height: 297
        configCollapsed: false
      surface_default:
        attachedHeight: 207
        detachedWidth: 2157
        detachedHeight: 1166
        detached: false
        detachedConfigOpen: false
  - name: nexus_bridge
    module: nexus_bridge
    device: cpu
    runtime: python
    provider: generic
    config:
      url: 'https://nexus.stelline.space'
    meta:
      node:
        x: 364.66666
        y: 924.6667
        width: 220
        height: 0
        configCollapsed: false
